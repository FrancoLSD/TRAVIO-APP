name: google_sign_in_native
description: Login nativo de Google en iOS (GoogleSignIn-iOS 10), compatible con Firebase 13.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.8.1
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: GoogleSignInNativePlugin
