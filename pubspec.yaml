name: travio_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.8.1

dependencies:
  cloud_firestore: ^7.0.0
  firebase_auth: ^7.0.0
  firebase_core: ^5.0.0
  flutter:
    sdk: flutter
  google_sign_in_native:
    path: packages/google_sign_in_native
  flutter_riverpod: ^3.3.2
  go_router: ^17.0.0
  intl: ^0.20.2
  package_info_plus: ^10.2.2
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.3
  purchases_flutter: ^10.17.0
  purchases_ui_flutter: ^10.17.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  change_app_package_name: ^1.5.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
